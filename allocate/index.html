    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The source carries the full edition's sentence. The
         allocate-edition-title plugin in vite.config.ts rewrites it at build
         time for the liquidity edition, which has no Policy or Managers step
         to name, and og:description is read back off whichever one survives —
         so in a built page this is the sentence that edition was given. -->
    <meta
      name="description"
      content="Allocate is a close-the-month tool for allocators: liquidity, policy drift, manager changes and a review, every number traced to its input. Demo on synthetic data."
    />
    <!-- brand-600, the harbour blue in tailwind.config.js. A hex here rather
         than a token because this file is not built by Tailwind. -->
    <meta name="theme-color" content="#0B5D8A" />
    <!-- The source carries the full edition's title; the same plugin
         rewrites it. -->
    <title>Allocate</title>
    <script type="module" crossorigin src="./assets/index-175jzIyF.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CHXbR-DR.css">
    <meta property="og:title" content="Allocate" />
    <meta property="og:description" content="Allocate is a close-the-month tool for allocators: liquidity, policy drift, manager changes and a review, every number traced to its input. Demo on synthetic data." />
